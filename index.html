<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#d4a854">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Camara Solcito</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>📷 Analog Cam</h1>
            <div class="film-counter" id="filmCounter">36</div>
        </header>

        <div class="settings-modal" id="settingsModal">
            <div class="settings-content">
                <div class="settings-header">
                    <h2>Ajustes</h2>
                    <button class="close-settings" id="closeSettings">✕</button>
                </div>

                <div class="settings-section">
                    <h3>Formato</h3>
                    <div class="ratio-selector">
                        <button class="ratio-btn active" data-ratio="3/2" title="35mm Film">3:2</button>
                        <button class="ratio-btn" data-ratio="4/3" title="Classic">4:3</button>
                        <button class="ratio-btn" data-ratio="1/1" title="Instagram">1:1</button>
                        <button class="ratio-btn" data-ratio="16/9" title="Widescreen">16:9</button>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Film Stock</h3>
                    <div class="filter-list">
                        <button class="filter-btn active" data-filter="kodak">
                            <span class="filter-name">Kodak Portra</span>
                            <span class="filter-desc">Peachy tones, faded blacks</span>
                        </button>
                        <button class="filter-btn" data-filter="fuji">
                            <span class="filter-name">Fuji 400H</span>
                            <span class="filter-desc">Cyan skies, cool tones</span>
                        </button>
                        <button class="filter-btn" data-filter="cinestill">
                            <span class="filter-name">CineStill 800T</span>
                            <span class="filter-desc">Tungsten, red halation</span>
                        </button>
                        <button class="filter-btn" data-filter="ilford">
                            <span class="filter-name">Ilford HP5</span>
                            <span class="filter-desc">B&W High Contrast</span>
                        </button>
                        <button class="filter-btn" data-filter="agfa">
                            <span class="filter-name">Agfa Vista</span>
                            <span class="filter-desc">Ultra satiated, warm</span>
                        </button>
                        <button class="filter-btn" data-filter="lomography">
                            <span class="filter-name">Lomo Purple</span>
                            <span class="filter-desc">Psychedelic magenta</span>
                        </button>
                        <button class="filter-btn" data-filter="custom" id="customFilterBtn">
                            <span class="filter-name">⚙️ Custom</span>
                            <span class="filter-desc">Create your own look</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="camera-container" id="cameraContainer">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="previewCanvas"></canvas>
            <div class="crop-frame" id="cropFrame"></div>
            <div class="film-grain"></div>
            <div class="vignette"></div>
            <div class="light-leak" id="lightLeak"></div>
            <div class="date-stamp" id="dateStamp"></div>
        </div>



        <div class="custom-controls" id="customControls">
            <div class="custom-header">
                <h3>Ecualización Personalizada</h3>
                <button class="close-custom" id="closeCustom">✕</button>
            </div>
            <div class="sliders-container">
                <div class="slider-group">
                    <label>Calidez <span id="warmthValue">0</span></label>
                    <input type="range" id="warmth" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Contraste <span id="contrastValue">0</span></label>
                    <input type="range" id="contrast" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Saturación <span id="saturationValue">0</span></label>
                    <input type="range" id="saturation" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Brillo <span id="brightnessValue">0</span></label>
                    <input type="range" id="brightness" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Verde/Magenta <span id="tintValue">0</span></label>
                    <input type="range" id="tint" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Fade (Sombras) <span id="fadeValue">0</span></label>
                    <input type="range" id="fade" min="0" max="50" value="0" step="1">
                </div>
                <button class="reset-btn" id="resetCustom">Resetear</button>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn small-btn" id="settingsBtn">
                <span>⚙️</span>
            </button>
            <button class="control-btn" id="galleryBtn">
                <span>🖼️</span>
            </button>
            <div class="capture-group">
                <button class="mode-toggle" id="modeToggle">
                    <span class="mode-icon">📷</span>
                </button>
                <button class="shutter-btn" id="captureBtn">
                    <div class="shutter-inner"></div>
                </button>
            </div>
            <button class="control-btn" id="switchCamera">
                <span>🔄</span>
            </button>
            <div class="spacer" style="width: 40px"></div>
        </div>

        <div class="gallery-modal" id="galleryModal">
            <div class="gallery-header">
                <h2>Galería</h2>
                <div class="gallery-header-actions">
                    <button class="clear-cache-btn" id="clearCacheBtn">🗑️ Limpiar Caché</button>
                    <button class="close-gallery" id="closeGallery">✕</button>
                </div>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <div class="flash-effect" id="flashEffect"></div>
    </div>

    <script src="crop-frame.js"></script>
    <script src="video-recorder.js"></script>
    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('✅ PWA ready'))
                .catch(err => console.log('SW error:', err));
        }
    </script>
</body>

</html>
