<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#d4a854">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Camara Solcito</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>📷 Analog Cam</h1>
            <div class="film-counter" id="filmCounter">36</div>
        </header>

        <div class="ratio-selector">
            <button class="ratio-btn active" data-ratio="3/2" title="35mm Film">3:2</button>
            <button class="ratio-btn" data-ratio="4/3" title="Classic">4:3</button>
            <button class="ratio-btn" data-ratio="1/1" title="Instagram">1:1</button>
            <button class="ratio-btn" data-ratio="16/9" title="Widescreen">16:9</button>
        </div>

        <div class="camera-container" id="cameraContainer">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="previewCanvas"></canvas>
            <div class="film-grain"></div>
            <div class="vignette"></div>
            <div class="light-leak" id="lightLeak"></div>
            <div class="date-stamp" id="dateStamp"></div>
        </div>

        <div class="filter-selector">
            <button class="filter-btn active" data-filter="kodak" title="Tonos peachy cálidos, faded blacks">
                Kodak Portra
            </button>
            <button class="filter-btn" data-filter="fuji" title="Cyan/teal en cielos, tonos fríos">
                Fuji 400H
            </button>
            <button class="filter-btn" data-filter="cinestill" title="Azul en sombras, halación roja">
                CineStill 800T
            </button>
            <button class="filter-btn" data-filter="ilford" title="B&W alto contraste, sepia cálido">
                Ilford HP5
            </button>
            <button class="filter-btn" data-filter="agfa" title="Colores ultra saturados, naranja intenso">
                Agfa Vista
            </button>
            <button class="filter-btn" data-filter="lomography" title="Cross-process magenta psicodélico">
                Lomo Purple
            </button>
            <button class="filter-btn" data-filter="custom" title="Crea tu propio estilo" id="customFilterBtn">
                ⚙️ Personalizada
            </button>
        </div>

        <div class="custom-controls" id="customControls">
            <div class="custom-header">
                <h3>Ecualización Personalizada</h3>
                <button class="close-custom" id="closeCustom">✕</button>
            </div>
            <div class="sliders-container">
                <div class="slider-group">
                    <label>Calidez <span id="warmthValue">0</span></label>
                    <input type="range" id="warmth" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Contraste <span id="contrastValue">0</span></label>
                    <input type="range" id="contrast" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Saturación <span id="saturationValue">0</span></label>
                    <input type="range" id="saturation" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Brillo <span id="brightnessValue">0</span></label>
                    <input type="range" id="brightness" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Verde/Magenta <span id="tintValue">0</span></label>
                    <input type="range" id="tint" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Fade (Sombras) <span id="fadeValue">0</span></label>
                    <input type="range" id="fade" min="0" max="50" value="0" step="1">
                </div>
                <button class="reset-btn" id="resetCustom">Resetear</button>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="switchCamera">
                <span>🔄</span>
            </button>
            <button class="shutter-btn" id="captureBtn">
                <div class="shutter-inner"></div>
            </button>
            <button class="control-btn" id="galleryBtn">
                <span>🖼️</span>
            </button>
        </div>

        <div class="gallery-modal" id="galleryModal">
            <div class="gallery-header">
                <h2>Galería</h2>
                <div class="gallery-header-actions">
                    <button class="clear-cache-btn" id="clearCacheBtn">🗑️ Limpiar Caché</button>
                    <button class="close-gallery" id="closeGallery">✕</button>
                </div>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <div class="flash-effect" id="flashEffect"></div>
    </div>

    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('✅ PWA ready'))
                .catch(err => console.log('SW error:', err));
        }
    </script>
</body>

</html>
