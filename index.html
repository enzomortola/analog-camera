<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#d4a854">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Camara Solcito</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Camera full screen -->
        <div class="camera-container" id="cameraContainer">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="previewCanvas"></canvas>

            <!-- Black overlays para delimitar área de captura -->
            <div class="crop-overlay crop-overlay-top"></div>
            <div class="crop-overlay crop-overlay-bottom"></div>
            <div class="crop-overlay crop-overlay-left"></div>
            <div class="crop-overlay crop-overlay-right"></div>

            <div class="film-grain"></div>
            <div class="vignette"></div>
            <div class="light-leak" id="lightLeak"></div>

            <!-- Top bar con info -->
            <div class="top-bar">
                <div class="film-counter" id="filmCounter">36</div>
                <div class="date-stamp" id="dateStamp"></div>
            </div>
        </div>

        <!-- Bottom controls (siempre visibles) -->
        <div class="bottom-controls">
            <button class="icon-btn" id="settingsBtn">
                <span>⚙️</span>
            </button>

            <div class="capture-group">
                <button class="mode-toggle" id="modeToggle">
                    <span class="mode-icon">📷</span>
                </button>
                <button class="shutter-btn" id="captureBtn">
                    <div class="shutter-inner"></div>
                </button>
            </div>

            <button class="icon-btn" id="galleryBtn">
                <span>🖼️</span>
            </button>
        </div>

        <!-- Settings panel (desplegable) -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h3>Ajustes</h3>
                <button class="close-settings" id="closeSettings">✕</button>
            </div>

            <div class="settings-content">
                <!-- Camera controls -->
                <div class="setting-group">
                    <label>Cámara</label>
                    <button class="setting-btn" id="switchCamera">
                        <span>🔄</span> Cambiar cámara
                    </button>
                </div>

                <!-- Aspect ratio -->
                <div class="setting-group">
                    <label>Proporción</label>
                    <div class="ratio-buttons">
                        <button class="ratio-btn active" data-ratio="3/2">3:2</button>
                        <button class="ratio-btn" data-ratio="4/3">4:3</button>
                        <button class="ratio-btn" data-ratio="1/1">1:1</button>
                        <button class="ratio-btn" data-ratio="16/9">16:9</button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="setting-group">
                    <label>Filtros</label>
                    <div class="filter-grid">
                        <button class="filter-btn active" data-filter="kodak">Kodak</button>
                        <button class="filter-btn" data-filter="fuji">Fuji</button>
                        <button class="filter-btn" data-filter="cinestill">CineStill</button>
                        <button class="filter-btn" data-filter="ilford">Ilford</button>
                        <button class="filter-btn" data-filter="agfa">Agfa</button>
                        <button class="filter-btn" data-filter="lomography">Lomo</button>
                        <button class="filter-btn" data-filter="custom">Custom</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom filter panel -->
        <div class="custom-controls" id="customControls">
            <div class="custom-header">
                <h3>Filtro Personalizado</h3>
                <button class="close-custom" id="closeCustom">✕</button>
            </div>
            <div class="sliders-container">
                <div class="slider-group">
                    <label>Calidez <span id="warmthValue">0</span></label>
                    <input type="range" id="warmth" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Contraste <span id="contrastValue">0</span></label>
                    <input type="range" id="contrast" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Saturación <span id="saturationValue">0</span></label>
                    <input type="range" id="saturation" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Brillo <span id="brightnessValue">0</span></label>
                    <input type="range" id="brightness" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Verde/Magenta <span id="tintValue">0</span></label>
                    <input type="range" id="tint" min="-50" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Fade <span id="fadeValue">0</span></label>
                    <input type="range" id="fade" min="0" max="50" value="0" step="1">
                </div>
                <div class="slider-group">
                    <label>Grain <span id="grainValue">6</span></label>
                    <input type="range" id="grainIntensity" min="0" max="20" value="6" step="1">
                </div>
                <div class="slider-group">
                    <label>Viñeta <span id="vignetteValue">0.25</span></label>
                    <input type="range" id="vignetteIntensity" min="0" max="100" value="25" step="1">
                </div>
                <button class="reset-btn" id="resetCustom">Resetear</button>
            </div>
        </div>

        <!-- Gallery -->
        <div class="gallery-modal" id="galleryModal">
            <div class="gallery-header">
                <h2>Galería</h2>
                <div class="gallery-header-actions">
                    <button class="clear-cache-btn" id="clearCacheBtn">🗑️ Limpiar Caché</button>
                    <button class="close-gallery" id="closeGallery">✕</button>
                </div>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <div class="flash-effect" id="flashEffect"></div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('✅ PWA ready'))
                .catch(err => console.log('SW error:', err));
        }
    </script>
</body>

</html>
